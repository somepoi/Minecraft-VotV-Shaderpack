name: Validate shaderpack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt

      - name: Build and validate shaderpack archives
        run: python tools/build.py

      - name: Ensure generated files are up to date
        run: git diff --exit-code

      - name: Upload shaderpack artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-VotV-Shaderpack
          path: |
            dist/Minecraft-VotV-Shaderpack-1.0.2.zip
            dist/Minecraft-VotV-Shaderpack-1.0.2.zip.sha256
          if-no-files-found: error
          retention-days: 90
